<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parciais de Venda – Postos Pichilau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#16202C; --muted:#5A6677; --line:#D5DBE3;
  --blue:#13509B; --blue-soft:#E3ECF8; --orange:#E98300; --orange-soft:#FDEFD9;
  --ok:#1C8F4A; --ok-soft:#DFF3E7; --bad:#C9352A; --bad-soft:#FBE3E0; --tank:#E7EBF0;
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --paper:#0E151E; --card:#17212D; --ink:#E7ECF2; --muted:#9AA7B7; --line:#2B3747;
  --blue:#6FA6EC; --blue-soft:#1B2C44; --orange:#FFA43A; --orange-soft:#3A2A14;
  --ok:#43C67A; --ok-soft:#15301F; --bad:#FF6F62; --bad-soft:#3A1A17; --tank:#243142; } }
:root[data-theme="dark"]{ color-scheme:dark; --paper:#0E151E; --card:#17212D; --ink:#E7ECF2; --muted:#9AA7B7; --line:#2B3747;
  --blue:#6FA6EC; --blue-soft:#1B2C44; --orange:#FFA43A; --orange-soft:#3A2A14;
  --ok:#43C67A; --ok-soft:#15301F; --bad:#FF6F62; --bad-soft:#3A1A17; --tank:#243142; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:#fff;padding:10px 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font:700 22px/1 var(--fd);margin:0;letter-spacing:.2px;flex:1;min-width:0}
.top h1 small{display:block;font:500 13px/1.2 var(--fb);opacity:.85;margin-top:3px}
.top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 8px;max-width:48vw}
.top select option{color:#16202C}
main{max-width:880px;margin:0 auto;padding:14px 14px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font:600 13px/1 var(--fb)}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--blue)}
.tabs a[aria-current="page"] svg{stroke:var(--orange)}
section.v{display:none}
section.v.on{display:block}
h2{font:700 24px/1.1 var(--fd);margin:18px 2px 10px}
h3{font:600 19px/1.15 var(--fd);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}
.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.orange{background:var(--orange);color:#1b1206}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
table.t thead th{font:600 14px/1.1 var(--fd);color:var(--muted);letter-spacing:.2px;vertical-align:bottom}
table.t tr.sub td{font-weight:700;background:var(--blue-soft)}
table.t tr.sub td:first-child{background:var(--blue-soft)}
table.t tr.mixsub td,table.t tr.mixsub td:first-child{font-weight:700;background:var(--orange-soft)}
table.t td .p{display:block;font-size:12px;font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:600 13px/1.5 var(--fb)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--blue-soft);color:var(--blue)} .pill.warn{background:var(--orange-soft);color:var(--orange)}
/* Pista agora */
.agora{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.medidor{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.medidor .rot{font:600 15px/1 var(--fd);color:var(--muted)}
.medidor .num{font:700 44px/1 var(--fd);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.medidor .barra{height:8px;border-radius:4px;background:var(--tank);margin-top:8px;overflow:hidden}
.medidor .barra i{display:block;height:100%;border-radius:4px}
/* Líderes: tanques */
.lideres{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.lider{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;scroll-snap-align:start;position:relative}
.lider .rank{position:absolute;top:8px;left:10px;font:700 18px/1 var(--fd);color:var(--muted)}
.lider .rank.r1{color:var(--orange)}
.foto{width:68px;height:68px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:var(--blue-soft);color:var(--blue);font:700 26px/68px var(--fd);text-align:center;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.lider .nome{font:600 17px/1.1 var(--fd);min-height:2.2em;display:flex;align-items:center;justify-content:center}
.tanques{display:flex;gap:10px;justify-content:center;margin-top:8px}
.tq{width:46px}
.tq .corpo{height:120px;border-radius:10px 10px 6px 6px;background:var(--tank);position:relative;overflow:hidden;border:2px solid var(--line)}
.tq .corpo i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 4px 4px;transition:height .6s ease}
.tq .corpo .alvo{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--ink);opacity:.55}
.tq b{display:block;font:700 18px/1 var(--fd);margin-top:5px;font-variant-numeric:tabular-nums}
.tq span{display:block;font-size:12px;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion: reduce){ .tq .corpo i{transition:none} }
/* Enviar */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--blue);border-radius:14px;padding:26px 14px;background:var(--blue-soft);color:var(--blue);text-align:center;cursor:pointer;font-weight:600}
.drop svg{width:40px;height:40px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.imgout{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:10px 0}
.aviso{border-left:4px solid var(--orange);background:var(--orange-soft);padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.aviso.bad{border-color:var(--bad);background:var(--bad-soft)}
.aviso.ok{border-color:var(--ok);background:var(--ok-soft)}
.linha-tempo{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.lt{flex:none;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.lt b{display:block;font:700 18px/1 var(--fd)}
.lt span{font-size:12px;color:var(--muted)}
.lt.fech{border-color:var(--orange)}
.lt[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
/* Ajustes */
.cat{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.cat summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ck{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
.lidrow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.lidrow .foto{width:52px;height:52px;line-height:52px;font-size:20px;margin:0;cursor:pointer}
dialog{border:0;border-radius:14px;padding:18px;max-width:420px;width:calc(100% - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.55)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.vazio{text-align:center;padding:26px 12px;color:var(--muted)}
.vazio .btn{margin-top:10px}
.barras{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.barras div{flex:1;min-width:6px;border-radius:4px 4px 0 0;position:relative}
.barras-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
@media (max-width:420px){ .grid3{grid-template-columns:1fr 1fr} .medidor .num{font-size:38px} }
</style>
</head>
<body>
<header class="top">

<script>
// ===== Leitor B2Click (início) =====
function numBR(s){ if(typeof s==='number') return s; s=String(s||'').trim(); if(!s) return 0; return parseFloat(s.replace(/\./g,'').replace(',','.'))||0; }
function br2iso(d){ const m=String(d).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }
const RX_PROD=/^(\d{2,})\s+(.+?)\s+(-?[\d.]+,\d{3})\s+(-?[\d.]+,\d{2,3})\s+(-?[\d.]+,\d{2})\s+(-?\d+)\s+(-?[\d.]+,\d{2})$/;
const RX_SUB=/^(-?[\d.]+,\d{3})\s+(-?[\d.]+,\d{2})\s+(-?\d+)$/;
function novoResultado(fonte){ return {fonte, de:null, ate:null, emissao:null, postos:{}, setores:{}, total:null}; }
function lerLinhasB2(linhas, fonte){
  const R=novoResultado(fonte); let emp=null, setor=null, tabela=false, ultimoSub=null;
  for(let l of linhas){
    l=l.replace(/\s+/g,' ').trim(); if(!l) continue; let m;
    if((m=l.match(/Emiss[aã]o:\s*(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/i))) R.emissao={data:br2iso(m[1]),hora:m[2]};
    if((m=l.match(/De:\s*(\d{2}\/\d{2}\/\d{4})\s*at[eé]:\s*(\d{2}\/\d{2}\/\d{4})/i))){ R.de=br2iso(m[1]); R.ate=br2iso(m[2]); }
    if(/^Produto\s+Quantidade/i.test(l)){ tabela=true; continue; }
    if(!tabela) continue;
    if((m=l.match(/^EMPRESA\s+(\d+)\s*-\s*(.+)$/i))){ emp=m[1]; if(!R.postos[emp]) R.postos[emp]={nome:m[2].trim(),itens:[]}; continue; }
    if((m=l.match(RX_PROD)) && emp && setor){ R.postos[emp].itens.push({s:setor,c:m[1],n:m[2].trim(),q:numBR(m[3]),v:numBR(m[5]),k:parseInt(m[6],10)}); continue; }
    if((m=l.match(/^(\d+)\s*-\s*([^\d\s].*)$/))){ setor=m[1]; R.setores[setor]=m[2].trim(); continue; }
    if((m=l.match(RX_SUB))){ ultimoSub={q:numBR(m[1]),v:numBR(m[2]),k:parseInt(m[3],10)}; }
  }
  R.total=ultimoSub; return R;
}
async function lerPDF(buf, pdfjs){
  const pdf=await pdfjs.getDocument({data:buf}).promise; const linhas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:1}); const tc=await pg.getTextContent(); const grupos=[];
    for(const it of tc.items){ const s=(it.str||'').trim(); if(!s) continue; const t=pdfjs.Util.transform(vp.transform,it.transform); const x=t[4], y=-t[5];
      let g=grupos.find(g=>Math.abs(g.y-y)<2.5); if(!g){ g={y,itens:[]}; grupos.push(g); } g.itens.push({x,s}); }
    grupos.sort((a,b)=>b.y-a.y); for(const g of grupos){ g.itens.sort((a,b)=>a.x-b.x); linhas.push(g.itens.map(i=>i.s).join(' ')); }
  }
  return linhas.some(l=>/comiss[aã]o sobre vendas por vendedor/i.test(l))?lerLinhasVend(linhas):lerLinhasB2(linhas,'pdf');
}
function lerXLSX(buf, XLSX){
  const wb=XLSX.read(buf,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const R=novoResultado('xlsx'); let hi=-1;
  for(let i=0;i<rows.length && i<30;i++){ const r=rows[i].map(x=>String(x??'').trim().toUpperCase()); if(r.includes('PRODUTO')&&r.includes('QUANTIDADE')){ hi=i; break; } }
  if(hi<0) throw new Error('Não achei a linha de títulos (Produto, Quantidade, Total) na planilha.');
  const topo=rows.slice(0,hi).flat().filter(Boolean).join('\n'); let m;
  if((m=topo.match(/De:\s*(\d{2}\/\d{2}\/\d{4})\s*at[eé]:\s*(\d{2}\/\d{2}\/\d{4})/i))){ R.de=br2iso(m[1]); R.ate=br2iso(m[2]); }
  const H=rows[hi].map(x=>String(x??'').trim().toUpperCase()); const col=n=>H.indexOf(n);
  const cE=col('COD_EMPRESA'), cF=col('NOME_FANTASIA'), cD=col('DATA_VENDA'), cG=col('GRUPO'), cNG=col('NOME_GRUPO'), cP=col('PRODUTO'), cN=col('NOME'), cQ=col('QUANTIDADE'), cT=col('TOTAL'), cK=col('QTD. VENDAS');
  if(cP<0||cQ<0||cT<0||cG<0) throw new Error('A planilha não tem as colunas esperadas (GRUPO, Produto, Quantidade, Total).');
  const datas=new Set();
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const a=String(r[0]??'').trim();
    if(/^Total Geral/i.test(a)){ R.total={q:numBR(r[cQ]),v:numBR(r[cT]),k:parseInt(r[cK]??0,10)||0}; continue; }
    const prod=r[cP]; if(prod==null||prod===''||isNaN(Number(prod))) continue;
    const emp=String(cE>=0?Math.round(Number(r[cE])):'0'); const s=String(Math.round(Number(r[cG])));
    if(!R.postos[emp]) R.postos[emp]={nome:String(cF>=0?r[cF]:emp).trim(),itens:[]};
    if(cNG>=0) R.setores[s]=String(r[cNG]||'').trim(); if(cD>=0&&r[cD]) datas.add(br2iso(r[cD]));
    R.postos[emp].itens.push({s,c:String(Math.round(Number(prod))),n:String(r[cN]||'').trim(),q:numBR(r[cQ]),v:numBR(r[cT]),k:parseInt(r[cK]??0,10)||0});
  }
  if(datas.size>1) R.variasDatas=[...datas];
  if(!R.de && datas.size===1){ R.de=R.ate=[...datas][0]; }
  return R;
}
const RX_VPROD=/^(\d{2,})\s+(.+?)\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})$/;
function lerLinhasVend(linhas){ const R={fonte:'pdf',tipo:'vend',de:null,ate:null,emissao:null,posto:null,postoNome:'',vend:{},setores:{},total:null}; let vd=null,s=null,ult=null;
  for(let l of linhas){ l=l.replace(/\s+/g,' ').trim(); if(!l) continue; let m;
    if((m=l.match(/Emiss[aã]o:\s*(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/i))) R.emissao={data:br2iso(m[1]),hora:m[2]};
    if((m=l.match(/^Data:\s*(\d{2}\/\d{2}\/\d{4})\s*a\s*(\d{2}\/\d{2}\/\d{4})/i))){ R.de=br2iso(m[1]); R.ate=br2iso(m[2]); continue; }
    if((m=l.match(/^Empresa:\s*(\d+)\s*-\s*(.+)$/i))){ R.posto=m[1]; R.postoNome=m[2].trim(); continue; }
    if((m=l.match(/^VENDEDOR\s+(\d+)\s*-\s*(.+)$/i))){ vd=m[1]; if(!R.vend[vd]) R.vend[vd]={nome:m[2].trim(),itens:[]}; continue; }
    if((m=l.match(/^GRUPO\s+(\d+)\s*-\s*(.+)$/i))){ s=m[1]; R.setores[s]=m[2].trim(); continue; }
    if((m=l.match(RX_VPROD))&&vd&&s){ R.vend[vd].itens.push({s,c:m[1],q:numBR(m[3]),v:numBR(m[5])}); continue; }
    if((m=l.match(/^(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})$/))) ult={v:numBR(m[3])};
  }
  R.total=ult; return R; }

<script>
const VERSAO='2.5.0';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const fmtN=(n,d)=>(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtL=n=>fmtN(n,3), fmtR=n=>'R$ '+fmtN(n,2), fmtP=n=>isFinite(n)?Math.round(n*100)+'%':'–';
const fmtU=(n,un)=>un==='L'?fmtL(n):fmtR(n);
const fmtUc=(n,un)=>un==='L'?fmtN(n,0)+' L':'R$ '+fmtN(n,0);
const sinal=(n,un)=>(n>=0?'+':'−')+(un==='L'?fmtL(Math.abs(n)):fmtR(Math.abs(n)));
const hmin=h=>{const [a,b]=String(h).split(':').map(Number);return (a||0)*60+(b||0)};
const minh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

 categorias:[
  {id:'gc',nome:'Gasolina C.',grupo:'comb',un:'L',produtos:['10001'],setores:[],meta:2666.66},
  {id:'gd',nome:'G. Dura Mais',grupo:'comb',un:'L',produtos:['10002'],setores:[],meta:800},
  {id:'et',nome:'Etanol',grupo:'comb',un:'L',produtos:['10003'],setores:[],meta:700},
  {id:'ds',nome:'Diesel S-10',grupo:'comb',un:'L',produtos:['10004'],setores:[],meta:25000},
  {id:'arla',nome:'Arla',grupo:'mix',un:'R$',produtos:[],setores:['2'],meta:4333.33},
  {id:'lub',nome:'Lubrificante',grupo:'mix',un:'R$',produtos:[],setores:['4'],meta:2833.33},
  {id:'adt',nome:'Aditivo',grupo:'mix',un:'R$',produtos:[],setores:['5'],meta:1166.67},

  {id:'car',nome:'Car Care',grupo:'mix',un:'R$',produtos:[],setores:['21'],meta:600}],
 duramais:{comum:'gc',dura:'gd'}, setores:{}, produtosComb:{}, emailPista:String(cod)==='16'?'pista.escada@pichilau.com.br':'', obrigacoes:JSON.parse(JSON.stringify(OBRIG_PADRAO))}}

/* ---------- armazenamento: banco do app (compartilhado) ou deste aparelho ---------- */
const S={mode:'local',canEdit:true,cfgs:{},posto:null,dias:{},fotos:{},curvas:{},rel:'lider',per:'mes',perDe:null,perAte:null,dashPer:'hoje',parcSel:null,lido:null,dirty:null};
let DB=null,USER=null,DL=null;
const LOC={get(){try{return JSON.parse(localStorage.getItem('parc-dados')||'{}')}catch{return {}}},set(o){try{localStorage.setItem('parc-dados',JSON.stringify(o))}catch{toast('Sem espaço para guardar neste aparelho')}}};
const Store={
  async cfgs(){ if(S.mode==='db'){const sn=await DB.collection('cfg').get();const o={};sn.docs.forEach(d=>o[d.id]=d.data());return o} return LOC.get().cfg||{} },
  async salvarCfg(c){ if(S.mode==='db'){await DB.doc('cfg/'+c.codigo).set(JSON.parse(JSON.stringify(c)));return} const o=LOC.get();o.cfg=o.cfg||{};o.cfg[c.codigo]=c;LOC.set(o) },
  async foto(p,id){ if(S.mode==='db'){const s=await DB.doc('fotos/'+p+'-'+id).get();return s.exists?s.data().img:null} return (LOC.get().fotos||{})[p+'-'+id]||null },
  async salvarFoto(p,id,img){ if(S.mode==='db'){ if(img) await DB.doc('fotos/'+p+'-'+id).set({img}); else await DB.doc('fotos/'+p+'-'+id).delete(); return} const o=LOC.get();o.fotos=o.fotos||{}; if(img)o.fotos[p+'-'+id]=img; else delete o.fotos[p+'-'+id]; LOC.set(o) },
  async dias(postos,de,ate){ let arr=[];
    if(S.mode==='db'){ let q=DB.collection('dias').where('data','>=',de).where('data','<=',ate); if(postos.length<=30) q=q.where('posto','in',postos); const sn=await q.get(); arr=sn.docs.map(d=>d.data()); }
    else { arr=Object.values(LOC.get().dias||{}).filter(d=>d.data>=de&&d.data<=ate); }
    return arr.filter(d=>postos.includes(d.posto)) },
  async salvarParcial(posto,data,p,nomes,setores){ const id=posto+'_'+data, key=p.h.replace(':','');
    if(S.mode==='db'){ const ref=DB.doc('dias/'+id); const sn=await ref.get();
      if(sn.exists) await ref.update({parciais:{[key]:p},nomes,setores}); else await ref.set({posto,data,parciais:{[key]:p},nomes,setores});
      const n=await ref.get(); return n.data(); }
    const o=LOC.get();o.dias=o.dias||{};const d=o.dias[id]||{posto,data,parciais:{},nomes:{},setores:{}};d.parciais[key]=p;Object.assign(d.nomes,nomes);Object.assign(d.setores,setores);o.dias[id]=d;LOC.set(o);return d },
  async apagarParcial(posto,data,key){ const id=posto+'_'+data;
    if(S.mode==='db'){ const ref=DB.doc('dias/'+id); const sn=await ref.get(); if(!sn.exists) return null; const d=JSON.parse(JSON.stringify(sn.data())); delete d.parciais[key];
      if(!Object.keys(d.parciais).length){await ref.delete();return null} await ref.set(d); return d }
    const o=LOC.get(); const d=o.dias?.[id]; if(!d) return null; delete d.parciais[key]; if(!Object.keys(d.parciais).length){delete o.dias[id];LOC.set(o);return null} LOC.set(o); return d }
};
const comTempo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('tempo')),ms))]);

/* ---------- cálculos ---------- */
const cfgDe=p=>S.cfgs[p];
const memo=new WeakMap();
function calc(cfg,itens){ if(memo.has(itens)&&memo.get(itens).cfg===cfg) return memo.get(itens).r;
  const v={},q={};cfg.categorias.forEach(c=>{v[c.id]=0}); const pm={},sm={}; const sem={};
  cfg.categorias.forEach(c=>{(c.produtos||[]).forEach(x=>{pm[x]=pm[x]||c});(c.setores||[]).forEach(x=>{sm[x]=sm[x]||c})});
  for(const it of itens||[]){ const c=pm[it.c]||sm[it.s]; if(c) v[c.id]+= c.un==='L'?it.q:it.v; else { sem[it.s]=(sem[it.s]||0)+it.v; } }
  const r={v,sem}; memo.set(itens,{cfg,r}); return r }
const grupo=(cfg,g)=>cfg.categorias.filter(c=>c.grupo===g);
const somaG=(cfg,v,g)=>grupo(cfg,g).reduce((a,c)=>a+(v[c.id]||0),0);
const metaG=(cfg,g,f=()=>1)=>grupo(cfg,g).reduce((a,c)=>a+c.meta*f(c),0);
const zeros=cfg=>Object.fromEntries(cfg.categorias.map(c=>[c.id,0]));
function fimFech(cfg,t){const F=cfg.fechamentos.map(hmin);return t===F.length-1?1440:F[t]}
/* participação da venda até um horário: pelas horas do dia ou, com 7+ dias completos, pelo ritmo real do posto */
function share(posto,catId,min){ const cfg=cfgDe(posto); const cv=S.curvas[posto]?.[catId];
  if(min>=1439) return 1; if(min<=0) return 0;
  if(!cv) return min/1440;
  const pts=[[0,0],...cfg.fechamentos.map((h,i)=>[fimFech(cfg,i),i===cfg.fechamentos.length-1?1:cv[i]])];
  for(let i=1;i<pts.length;i++){ if(min<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(min-x0)/(x1-x0)} } return 1 }
function montarCurva(posto){ const cfg=cfgDe(posto); if(!cfg) return; const n=cfg.fechamentos.length; const acum={}; let dias=0;
  for(const d of Object.values(S.dias)){ if(d.posto!==posto||d.data>=hoje()) continue; const porT=fechPorTurno(d);
    if(Object.keys(porT).length<n) continue; const fin=calc(cfg,porT[n-1].itens).v; dias++;
    cfg.categorias.forEach(c=>{ acum[c.id]=acum[c.id]||Array(n).fill(0); for(let t=0;t<n;t++){ const v=calc(cfg,porT[t].itens).v[c.id]; acum[c.id][t]+= fin[c.id]>0? v/fin[c.id] : fimFech(cfg,t)/1440; } }); }
  if(dias<7){ delete S.curvas[posto]; return } S.curvas[posto]={}; for(const k in acum) S.curvas[posto][k]=acum[k].map(x=>Math.min(1,x/dias)) }
function parciaisOrd(d){return Object.values(d?.parciais||{}).sort((a,b)=>a.h<b.h?-1:1)}
function fechPorTurno(d){const o={};for(const p of parciaisOrd(d)) if(p.tipo==='fech'&&p.turno!=null) o[p.turno]=p;return o}
function ultimo(d){const a=parciaisOrd(d);return a[a.length-1]||null}
function turnos(d){ const cfg=cfgMes(cfgDe(d.posto),d.data); if(!cfg) return []; const porT=fechPorTurno(d); const out=[]; let prev=null, ini=0;
  for(let t=0;t<cfg.fechamentos.length;t++){ const p=porT[t]; if(!p) continue; const vp=calc(cfg,p.itens).v, va=prev?calc(cfg,prev.itens).v:zeros(cfg); const fim=fimFech(cfg,t);
    const v={},m={}; cfg.categorias.forEach(c=>{ v[c.id]=vp[c.id]-va[c.id]; m[c.id]=c.meta*(share(d.posto,c.id,fim)-share(d.posto,c.id,ini)); });
    out.push({t,ini,fim,lider:p.lider||{id:'',nome:'Sem líder'},v,m,data:d.data,posto:d.posto}); prev=p; ini=fim; }
  return out }
function fechado(d){const cfg=cfgDe(d.posto);return cfg&&fechPorTurno(d)[cfg.fechamentos.length-1]}
/* total do dia: último relatório; meta do dia inteira se fechado, senão proporcional à hora */
function totalDia(d){ const cfg=cfgMes(cfgDe(d.posto),d.data); const u=ultimo(d); if(!cfg||!u) return null; const v=calc(cfg,u.itens).v; const fim=fechado(d)?1440:hmin(u.h);
  const m={}; cfg.categorias.forEach(c=>m[c.id]=c.meta*share(d.posto,c.id,fim)); return {v,m,h:u.h,completo:fim===1440} }

/* ---------- carregar ---------- */
async function carregarDias(postos,de,ate){ const arr=await comTempo(Store.dias(postos,de,ate),15000);
  for(const k of Object.keys(S.dias)){ const d=S.dias[k]; if(postos.includes(d.posto)&&d.data>=de&&d.data<=ate) delete S.dias[k]; }
  arr.forEach(d=>S.dias[d.posto+'_'+d.data]=d);
  try{ const av=await comTempo(Store.vends(postos,de,ate),15000); av.forEach(d=>S.vend[d.posto+'_'+d.data]=d) }catch{} }
const postosAtivos=()=>S.posto==='REDE'?Object.keys(S.cfgs):[S.posto];
let carregadoRecente={};
async function garantirRecentes(){ const ps=postosAtivos().filter(p=>!carregadoRecente[p]); if(!ps.length) return;
  const ini=hoje().slice(0,5)+'01-01', d62=addDias(hoje(),-62); await carregarDias(ps,ini<d62?ini:d62,hoje()); ps.forEach(p=>{carregadoRecente[p]=1;montarCurva(p)}); }
async function fotoDe(p,id){ const k=p+'-'+id; if(!(k in S.fotos)){ S.fotos[k]=null; try{S.fotos[k]=await Store.foto(p,id)}catch{} } return S.fotos[k] }

/* ---------- início ---------- */
function htmlFoto(src,nome,cls='foto'){return src?`<img class="${cls}" src="${src}" alt="">`:`<div class="${cls}" aria-hidden="true">${esc(iniciais(nome))}</div>`}
function corP(p){return p>=1?'var(--ok)':p>=.9?'var(--orange)':'var(--bad)'}
async function vInicio(){ const el=$('#v-inicio');
  if(!Object.keys(S.cfgs).length){ el.innerHTML=`<div class="card vazio"><h3>Nenhum posto cadastrado</h3><p>Cadastre o posto, as metas e os líderes para começar.</p><a class="btn" href="#ajustes">Abrir ajustes</a></div>`; return }
  el.innerHTML='<p class="muted">Carregando…</p>';
  try{ await garantirRecentes() }catch(e){ el.innerHTML=`<div class="aviso bad">Não consegui ler os dados agora. Confira a internet e abra de novo.</div>`; return }
  if(S.posto==='REDE') return inicioRede(el);
  const cfg=cfgMes(cfgDe(S.posto),hoje()), d=S.dias[S.posto+'_'+hoje()];
  const parc=parciaisOrd(d); const sel=(S.parcSel&&d?.parciais[S.parcSel])||parc[parc.length-1];
  let h=`<div class="row" style="margin:2px 2px 10px;align-items:flex-end"><label class="f" style="margin:0;max-width:190px">Ver o dia<input type="date" id="iniData" value="${hoje()}" max="${hojeReal()}"></label>${S.dataRef?'<button class="btn alt sm" id="iniHoje">Voltar para hoje</button>':''}</div>`;
  if(!sel){ h+=`<div class="card vazio"><h3>Sem parcial hoje</h3><p>Anexe o relatório do B2Click para ver como o dia está indo.</p><a class="btn orange" href="#enviar">Enviar parcial</a></div>`; }
  else {
    const v=calc(cfg,sel.itens).v; const fim=(sel.tipo==='fech'&&sel.turno===cfg.fechamentos.length-1)?1440:hmin(sel.h);
    const rc=somaG(cfg,v,'comb')/metaG(cfg,'comb',c=>share(S.posto,c.id,fim)), rm=somaG(cfg,v,'mix')/metaG(cfg,'mix',c=>share(S.posto,c.id,fim));
    h+=`<div class="row" style="justify-content:space-between;margin:4px 2px 8px"><div><b style="font:700 20px var(--fd)">${S.dataRef?dataBR(hoje()):'Hoje'} às ${sel.h}</b> <span class="muted small">${esc(sel.lider?.nome||'')}</span></div><a class="btn sm orange" href="#enviar">Nova parcial</a></div>`;
    h+=`<div class="agora">${[['Combustíveis no ritmo',rc],['Mix de produtos no ritmo',rm]].map(([r,p])=>`<div class="medidor"><div class="rot">${r}</div><div class="num" style="color:${corP(p)}">${fmtP(p)}</div><div class="small muted">da meta até ${fim===1440?'o fim do dia':sel.h}</div><div class="barra"><i style="width:${Math.min(100,p*100)}%;background:${corP(p)}"></i></div></div>`).join('')}</div>`;
    if(parc.length>1) h+=`<div class="linha-tempo" role="group" aria-label="Parciais de hoje">${parc.map(p=>`<button class="lt ${p.tipo==='fech'?'fech':''}" data-k="${p.h.replace(':','')}" aria-pressed="${p===sel}"><b>${p.h}</b><span>${p.tipo==='fech'?'fecha turno':'acompanha'}</span></button>`).join('')}</div>`;
    h+=`<div class="card" style="padding:6px 6px 2px"><div class="scroll">${tabelaParcial(cfg,v,fim,sel.h)}</div></div>`;
    h+=`<div class="row" style="margin-bottom:6px"><button class="btn alt sm" id="btImgHoje">Imagem para o WhatsApp</button></div><div id="imgHoje"></div>`;
  }
  h+=`<h2>Posto: realizado × meta</h2><div id="painelPosto"></div><h2>Líderes</h2><div class="chips" role="group" aria-label="Período">${[['hoje','Hoje'],['7','7 dias'],['mes','Este mês']].map(([k,t])=>`<button class="chip" data-dp="${k}" aria-pressed="${S.dashPer===k}">${t}</button>`).join('')}</div><div id="dashLid"></div><h2>Dia e mês da equipe</h2><div id="painelEquipe"></div><h2>Ranking dos vendedores</h2><div id="rankVend"></div><p class="small muted" style="text-align:center;margin:20px 8px 4px">Nossa missão: ser uma experiência feliz, conveniente e segura no seu caminho.</p>`;
  el.innerHTML=h;
  const mudaData=v=>{ S.dataRef=(!v||v>=hojeReal())?null:v; DATA_REF=S.dataRef; S.parcSel=null; carregadoRecente={}; vInicio() };
  if($('#iniData')) $('#iniData').onchange=e=>mudaData(e.target.value); if($('#iniHoje')) $('#iniHoje').onclick=()=>mudaData(null);
  $$('.lt',el).forEach(b=>b.onclick=()=>{S.parcSel=b.dataset.k;vInicio()});
  $$('[data-dp]',el).forEach(b=>b.onclick=()=>{S.dashPer=b.dataset.dp;vInicio()});
  if(sel) $('#btImgHoje').onclick=async()=>{await fontes();mostrarImagem($('#imgHoje'),imgParcial(cfg,S.posto,d.data,sel),`parcial_${S.posto}_${d.data}_${sel.h.replace(':','')}.png`,textoParcial(cfg,d.data,sel),emailDe(cfg))};
  painelPosto($('#painelPosto'),cfg); painelEquipe($('#painelEquipe'),cfg); rankVend($('#rankVend'),cfg);
  dashLideres($('#dashLid'),cfg);
}
function tabelaParcial(cfg,v,fim,h){ const linha=(c)=>{const r=v[c.id]||0, ma=c.meta*share(cfg.codigo,c.id,fim), p=ma?r/ma:0; return `<tr><td>${esc(c.nome)}</td><td>${fmtU(r,c.un)}</td><td>${fmtU(c.meta,c.un)}</td><td class="${r-c.meta>=0?'pos':'neg'}">${sinal(r-c.meta,c.un)}</td><td style="color:${corP(p)};font-weight:700">${fmtP(p)}</td></tr>`};
  const sub=(g,nome,cls)=>{const r=somaG(cfg,v,g), m=metaG(cfg,g), ma=metaG(cfg,g,c=>share(cfg.codigo,c.id,fim)), p=ma?r/ma:0; const un=g==='comb'?'L':'R$'; return `<tr class="${cls}"><td>${nome}</td><td>${fmtU(r,un)}</td><td>${fmtU(m,un)}</td><td class="${r-m>=0?'pos':'neg'}">${sinal(r-m,un)}</td><td style="color:${corP(p)}">${fmtP(p)}</td></tr>`};
  const dm=cfg.duramais, c1=v[dm?.comum]||0, c2=v[dm?.dura]||0;
  return `<table class="t"><thead><tr><th></th><th>Realizado</th><th>Meta diária</th><th>Diferença</th><th>Meta até ${fim===1440?'24h':h}</th></tr></thead><tbody>

const _cm=new Map();
function cfgMes(cfg,data){ if(!cfg||!data) return cfg; const mm=cfg.metasMes?.[data.slice(0,7)]?.cat; if(!mm) return cfg; let mp=_cm.get(cfg); if(!mp){mp={};_cm.set(cfg,mp)}

    g.fillStyle=l.tipo==='tot'?'#fff':'#111';caber(g,a,cols[i].w-14,i&&l.tipo!=='tot'?600:700,25);g.textAlign=i?'right':'left';g.textBaseline='middle';g.fillText(a,i?xs[i+1]-8:xs[i]+8,b?y+RH/2-11:y+RH/2);

function periodo(){ const t=hoje(); if(S.per==='hoje') return [t,t]; if(S.per==='semana'){const ds=diaSemana(t);return [addDias(t,-((ds+6)%7)),t]}
  if(S.per==='mes') return [t.slice(0,8)+'01',t]; if(S.per==='ano') return [t.slice(0,5)+'01-01',t]; return [S.perDe||t.slice(0,8)+'01',S.perAte||t] }
async function vRelatorios(){ const el=$('#v-relatorios');
  if(!Object.keys(S.cfgs).length){ el.innerHTML=`<div class="card vazio"><h3>Cadastre o posto primeiro</h3><a class="btn" href="#ajustes">Abrir ajustes</a></div>`; return }

  const tipos=rede?[['posto','Por posto'],['dia','Por dia']]:[['lider','Por líder'],['colab','Por colaborador'],['dia','Por dia'],['semana','Mesmo dia da semana']];
  const [de,ate]=periodo();

  `<div class="chips" role="group" aria-label="Período" style="margin-top:6px">${[['hoje','Hoje'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['pers','Escolher datas']].map(([k,t])=>`<button class="chip" data-p="${k}" aria-pressed="${S.per===k}">${t}</button>`).join('')}</div>
  ${S.per==='pers'?`<div class="grid2" style="max-width:420px;margin-top:8px"><label class="f">De<input type="date" id="pDe" value="${de}"></label><label class="f">Até<input type="date" id="pAte" value="${ate}"></label></div>`:''}`}
  <div id="relOut"><p class="muted">Carregando…</p></div>`;
  $$('[data-r]',el).forEach(b=>b.onclick=()=>{S.rel=b.dataset.r;vRelatorios()});
  $$('[data-p]',el).forEach(b=>b.onclick=()=>{S.per=b.dataset.p;vRelatorios()});
  if($('#pDe')){ $('#pDe').onchange=$('#pAte').onchange=()=>{S.perDe=$('#pDe').value;S.perAte=$('#pAte').value;vRelatorios()} }
  if($('#selDs')){ $('#selDs').value=S.ds??diaSemana(hoje()); $('#selDs').onchange=()=>{S.ds=+$('#selDs').value;vRelatorios()} }
  const out=$('#relOut');

  catch{ out.innerHTML='<div class="aviso bad">Não consegui ler os dados. Confira a internet e tente de novo.</div>'; return }
  const r=S.rel==='colab'?relColab(de,ate):S.rel==='lider'?relLider(de,ate):S.rel==='dia'?relDia(de,ate):S.rel==='semana'?relSemana():relPosto(de,ate);

  out.innerHTML=`<div class="card" style="padding:6px"><div class="scroll"><table class="t"><thead><tr>${r.cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${r.linhas.map(l=>`<tr class="${l.tipo==='tot'?'sub':''}">${l.cel.map(c=>{const [a,b,cor]=Array.isArray(c)?c:[c];return `<td>${esc(a)}${b?`<span class="p" style="color:${cor||'inherit'}">${esc(b)}</span>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>
  ${r.nota?`<p class="small muted">${r.nota}</p>`:''}<div class="row"><button class="btn alt sm" id="btImgRel">Imagem para o WhatsApp</button></div><div id="imgRel"></div>`;

function colsCat(cfg){ return [...grupo(cfg,'comb').map(c=>({t:c.nome+' (L)',c})),{t:'Combustíveis (L)',g:'comb'},...grupo(cfg,'mix').map(c=>({t:c.nome,c})),{t:'Mix produtos',g:'mix'}] }
function celulas(cfg,cols,v,m,pfx){ return cols.map(x=>{ const un=x.c?x.c.un:x.g==='comb'?'L':'R$'; const r=x.c?v[x.c.id]:somaG(cfg,v,x.g); const mm=m?(x.c?m[x.c.id]:somaG(cfg,m,x.g)):null; const p=mm?r/mm:null; return [fmtUc(r,un),p==null?'':(pfx||'')+fmtP(p),p==null?'':corP(p)] }) }
const nomePer=(de,ate)=>de===ate?dataBR(de):dataBR(de)+' a '+dataBR(ate);
function relLider(de,ate){ const cfg=cfgDe(S.posto), ag=agregarLideres(S.posto,de,ate), cols=colsCat(cfg);
  const ord=Object.entries(ag).sort((a,b)=>somaG(cfg,b[1].v,'comb')/(somaG(cfg,b[1].m,'comb')||1)-somaG(cfg,a[1].v,'comb')/(somaG(cfg,a[1].m,'comb')||1));
  const tv=zeros(cfg),tm=zeros(cfg); ord.forEach(([,a])=>cfg.categorias.forEach(c=>{tv[c.id]+=a.v[c.id];tm[c.id]+=a.m[c.id]}));
  const linhas=ord.map(([,a])=>({cel:[[a.nome,a.n+(a.n>1?' turnos':' turno')],...celulas(cfg,cols,a.v,a.m)]}));
  if(linhas.length) linhas.push({tipo:'tot',cel:[['Total'],...celulas(cfg,cols,tv,tm)]});
  return {titulo:`${cfg.codigo} - ${cfg.nome}: vendas por líder`,sub:nomePer(de,ate)+' · turnos fechados',cols:[{t:'Líder'},...cols],linhas,nota:'Cada turno = diferença entre o fechamento e o fechamento anterior. % = realizado ÷ meta do turno.'} }
function relDia(de,ate){ const ps=postosAtivos(); const cfg=cfgDe(ps[0]); const cols=colsCat(cfg); const linhas=[]; const tv=zeros(cfg),tm=zeros(cfg);
  for(let d=de;d<=ate;d=addDias(d,1)){ const v=zeros(cfg),m=zeros(cfg); let tem=false, inc=false;
    for(const p of ps){ const dd=S.dias[p+'_'+d]; const t=dd&&totalDia(dd); if(!t) continue; tem=true; if(!t.completo) inc=t.h; const c2=cfgDe(p); c2.categorias.forEach(c=>{ if(c.id in v){v[c.id]+=t.v[c.id];m[c.id]+=t.m[c.id]} }); }
    if(!tem) continue; cfg.categorias.forEach(c=>{tv[c.id]+=v[c.id];tm[c.id]+=m[c.id]});
    linhas.push({cel:[[dataCurta(d)+' '+NOMES_DIA[diaSemana(d)].slice(0,3),inc?'até '+inc:''],...celulas(cfg,cols,v,m)]}); }
  if(linhas.length>1) linhas.push({tipo:'tot',cel:[['Total'],...celulas(cfg,cols,tv,tm)]});
  return {titulo:(S.posto==='REDE'?'Rede Pichilau':`${cfg.codigo} - ${cfg.nome}`)+': vendas por dia',sub:nomePer(de,ate),cols:[{t:'Dia'},...cols],linhas,nota:'Usa o último relatório de cada dia. Dia sem fechamento das 23:59 aparece “até” o último horário, com a meta proporcional.'} }
function relSemana(){ const cfg=cfgDe(S.posto), cols=colsCat(cfg), ds=S.ds??diaSemana(hoje()); let d=hoje(); while(diaSemana(d)!==ds) d=addDias(d,-1);
  const datas=[]; for(let i=0;i<12;i++){datas.push(d);d=addDias(d,-7)} const tots=datas.map(x=>{const dd=S.dias[S.posto+'_'+x];return dd&&totalDia(dd)});
  const linhas=[]; datas.forEach((x,i)=>{ const t=tots[i]; if(!t) return; const ant=tots.slice(i+1).find(Boolean);
    linhas.push({cel:[[dataBR(x),t.completo?'dia fechado':'até '+t.h],...cols.map(c=>{const un=c.c?c.c.un:c.g==='comb'?'L':'R$';const r=c.c?t.v[c.c.id]:somaG(cfg,t.v,c.g);const a=ant?(c.c?ant.v[c.c.id]:somaG(cfg,ant.v,c.g)):null;const vr=a?r/a-1:null;
      return [fmtUc(r,un),vr==null?'':(vr>=0?'▲ ':'▼ ')+Math.abs(Math.round(vr*100))+'%',vr==null?'':vr>=0?'var(--ok)':'var(--bad)']})]}) });
  return {titulo:`${cfg.codigo} - ${cfg.nome}: ${NOMES_DIA[ds]} × ${NOMES_DIA[ds]}`,sub:'últimas 12 semanas',cols:[{t:'Data'},...cols],linhas,nota:'▲▼ = variação contra o mesmo dia da semana anterior que tem dados.'} }
function relPosto(de,ate){ const ref=cfgDe(Object.keys(S.cfgs)[0]), cols=colsCat(ref); const linhas=[]; const tv=zeros(ref),tm=zeros(ref);
  for(const cfg of Object.values(S.cfgs)){ const v=zeros(ref),m=zeros(ref); let tem=false;
    for(let d=de;d<=ate;d=addDias(d,1)){ const dd=S.dias[cfg.codigo+'_'+d]; const t=dd&&totalDia(dd); if(!t) continue; tem=true; ref.categorias.forEach(c=>{ if(c.id in t.v){v[c.id]+=t.v[c.id];m[c.id]+=t.m[c.id]} }); }
    if(!tem) continue; ref.categorias.forEach(c=>{tv[c.id]+=v[c.id];tm[c.id]+=m[c.id]}); linhas.push({cel:[[cfg.codigo+' - '+cfg.nome],...celulas(ref,cols,v,m)]}); }
  if(linhas.length>1) linhas.push({tipo:'tot',cel:[['Rede'],...celulas(ref,cols,tv,tm)]});
  return {titulo:'Rede Pichilau: vendas por posto',sub:nomePer(de,ate),cols:[{t:'Posto'},...cols],linhas,nota:'As categorias são somadas pelo código (ex.: “gc” = Gasolina C.) — mantenha os mesmos códigos em todos os postos.'} }

    const r=await dialogo(`<h3>Redefinir a senha</h3><p class="small">Enviamos um código de 6 números para ${esc(para)}. Ele vale por 30 minutos.</p><label class="f">Código<input id="rC" inputmode="numeric" maxlength="6"></label><label class="f">Nova senha (6 ou mais caracteres)<input id="rS" type="password"></label><label class="f">Repita a nova senha<input id="rS2" type="password"></label>`,[{t:'Cancelar',cls:'alt',v:null},{t:'Redefinir',ler:d=>({c:$('#rC',d).value,s:$('#rS',d).value,s2:$('#rS2',d).value})}]);
    if(r){ if(r.s!==r.s2) toast('As duas senhas não são iguais. Peça outro código.'); else { await api('redefinirSenha',{codigo:r.c,nova:r.s}); toast('Senha redefinida. Entre com a nova senha.') } } }catch(e){ toast(e.msg||'Não foi possível. Confira a internet.') } es.disabled=false }; $('#lgS').onkeydown=e=>{if(e.key==='Enter')$('#lgAdm').click()} }
async function contaAdmin(){ let em=''; try{ em=await api('adminEmail') }catch{}
  const r=await dialogo(`<h3>Administrador</h3><label class="f">E-mail que recebe o código de redefinição<input id="aE" type="email" value="${esc(em)}"></label><label class="f">Nova senha (em branco = mantém)<input id="aS" type="password"></label><label class="f">Repita a nova senha<input id="aS2" type="password"></label>`,[{t:'Cancelar',cls:'alt',v:null},{t:'Salvar',ler:d=>({e:$('#aE',d).value.trim(),s:$('#aS',d).value,s2:$('#aS2',d).value})}]);
  if(!r) return; try{ if(r.e&&r.e!==em) await api('adminEmail',{email:r.e}); if(r.s){ if(r.s!==r.s2) return toast('As duas senhas não são iguais'); await api('trocarSenha',{nova:r.s}); SESS.senha=r.s; try{sessionStorage.setItem('parc-sess',JSON.stringify(SESS))}catch{} } toast('Salvo') }catch(e){ toast(e.msg||'Não salvou') } }
function sair(){ try{ localStorage.removeItem('parc-sess'); sessionStorage.removeItem('parc-sess') }catch{} location.hash=''; location.reload() }
async function iniciar(){
  try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' }catch{}
  if(window.API_URL){ usarServidor(); if(!SESS){ try{ SESS=JSON.parse(lsGet('sess')||sessionStorage.getItem('parc-sess')||'null') }catch{} } if(!SESS) return telaLogin(); }
  else if(window.claude&&typeof claude.use==='function'){
    try{ DB=await claude.use('db') }catch{} try{ USER=await claude.use('user') }catch{} try{ DL=await claude.use('downloads') }catch{} }
  if(window.API_URL){ S.mode='api'; S.canEdit=!!SESS.senha; } else if(DB){ S.mode='db'; try{ S.canEdit=USER?!!(await USER.canEdit()):false }catch{ S.canEdit=false } } else { S.mode='local'; S.canEdit=true }
  try{ S.cfgs=await comTempo(Store.cfgs(),20000) }catch(e){ if(e.code==='auth'){ try{localStorage.removeItem('parc-sess');sessionStorage.removeItem('parc-sess')}catch{} return telaLogin(e.msg) } $('#subttl').textContent='Sem conexão com os dados'; }
  S.posto=SESS&&SESS.authPosto?String(SESS.authPosto):lsGet('posto'); preencherPostos(); rota();
}
iniciar();
</script>
